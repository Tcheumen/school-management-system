<div class="register-page">

  <div class="register-card">

    <div class="register-header">

      <div class="logo">
        SMS
      </div>

      <h1>Create Account</h1>

      <p>
        Register to access the School Management System
      </p>

    </div>

    @if (errorMessage) {
    <div class="error-message">
      {{ errorMessage }}
    </div>
    }

    <form #registerForm="ngForm" (ngSubmit)="register()">

      <div class="form-group">

        <label for="fullName">
          Full Name
        </label>

        <input id="fullName" type="text" name="fullName" [(ngModel)]="fullName" placeholder="Enter your full name"
          autocomplete="name" required />

      </div>

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
          autocomplete="email" required />

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Create a password"
          autocomplete="new-password" required />

      </div>

      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="confirmPassword"
          placeholder="Confirm your password" autocomplete="new-password" required />

      </div>

      <div class="form-group">

        <label for="role">
          Role
        </label>

        <select id="role" name="role" [(ngModel)]="role" required>

          <option value="" disabled>
            Select your role
          </option>

          <option value="STUDENT">
            Student
          </option>

          <option value="TEACHER">
            Teacher
          </option>

        </select>

      </div>

      <button type="submit" class="register-button" [disabled]="loading || registerForm.invalid">

        @if (loading) {
        Creating account...
        } @else {
        Register
        }

      </button>

      <div class="login-link">

        <span>
          Already have an account?
        </span>

        <a routerLink="/login">
          Login
        </a>

      </div>

    </form>

  </div>

</div>
