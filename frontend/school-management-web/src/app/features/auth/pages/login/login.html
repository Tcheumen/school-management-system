<div class="login-page">

  <div class="login-card">

    <div class="login-header">

      <div class="logo">
        SMS
      </div>

      <h1>
        School Management System
      </h1>

      <p>
        Sign in to access your account
      </p>

    </div>

    @if (errorMessage) {

    <div class="error-message">
      {{ errorMessage }}
    </div>

    }

    <form #loginForm="ngForm" (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
          autocomplete="email" required />

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Enter your password"
          autocomplete="current-password" required />

      </div>

      <button type="submit" class="login-button" [disabled]="
          loading ||
          loginForm.invalid
        ">

        @if (loading) {
        Signing in...
        } @else {
        Login
        }

      </button>

      <div class="register-link">

        <span>
          Don't have an account?
        </span>

        <a routerLink="/register">
          Register
        </a>

      </div>

    </form>

  </div>

</div>
